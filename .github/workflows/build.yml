name: Compilazione

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, arch: x64 }
          - { os: windows-latest, rid: win-x86, arch: x86 }
          - { os: windows-latest, rid: win-arm64, arch: arm64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: ubuntu-latest,  rid: linux-arm }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: macos-latest,   rid: osx-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Compila ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/IpDeskCtrl.Desktop/IpDeskCtrl.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o dist/${{ matrix.rid }}

      # ---------------------------------------------------------------- Windows: Setup.exe + zip portatile
      - name: Installatore Windows
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          $src = (Resolve-Path dist/${{ matrix.rid }}).Path
          $out = (Resolve-Path out).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" "/DOutDir=$out" packaging/windows/IP-DESK-CTRL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item THIRD-PARTY-NOTICES.txt dist/${{ matrix.rid }}/
          Copy-Item LICENSE dist/${{ matrix.rid }}/LICENSE.txt
          Compress-Archive -Path dist/${{ matrix.rid }}/IP-DESK-CTRL.exe, dist/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt, dist/${{ matrix.rid }}/LICENSE.txt -DestinationPath "out/IP-DESK-CTRL-$env:VERSION-${{ matrix.rid }}-portatile.zip"

      # ---------------------------------------------------------------- Linux e Raspberry: .deb, .rpm, Slackware .txz, tar.gz portatile
      - name: Pacchetti Linux
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/make-deb.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          sudo apt-get install -y -qq rpm >/dev/null
          packaging/linux/make-rpm.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          if [ "${{ matrix.rid }}" != "linux-arm" ]; then packaging/linux/make-slackpkg.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out; fi
          mkdir -p pkg/IP-DESK-CTRL
          cp dist/${{ matrix.rid }}/IP-DESK-CTRL pkg/IP-DESK-CTRL/
          chmod +x pkg/IP-DESK-CTRL/IP-DESK-CTRL
          cp THIRD-PARTY-NOTICES.txt LICENSE src/IpDeskCtrl/Assets/icon.png pkg/IP-DESK-CTRL/
          tar -czf "out/IP-DESK-CTRL-$VERSION-${{ matrix.rid }}-portatile.tar.gz" -C pkg IP-DESK-CTRL
          dpkg-deb --info out/*.deb | head -20

      # ---------------------------------------------------------------- AppImage, Arch Linux (.pkg.tar.zst), Snap
      - name: AppImage e Arch Linux
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get install -y -qq libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libfuse2 >/dev/null 2>&1 || true
          packaging/linux/make-appimage.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          packaging/linux/make-arch.sh ${{ matrix.rid }} "$VERSION" "$(ls out/*.deb | head -n 1)" out

      - name: Snap
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        continue-on-error: true
        shell: bash
        run: |
          sudo snap install snapcraft --classic
          packaging/linux/make-snap.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      # ---------------------------------------------------------------- macOS: .dmg + .app zip
      - name: Pacchetti macOS
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          chmod +x packaging/macos/make-dmg.sh
          packaging/macos/make-dmg.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-${{ matrix.rid }}
          path: out/*

  # ---------------------------------------------------------------- Android: APK firmato
  android:
    name: android
    runs-on: ubuntu-latest
    env:
      # chiave di firma fissa, nei segreti del repository (Settings › Secrets and variables › Actions):
      # con la stessa chiave gli aggiornamenti si installano sopra la versione precedente.
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # sul runner c'è anche un SDK più nuovo: per l'app Android (net8.0-android) si usa l'SDK 8
      - name: SDK 8 e carico di lavoro Android
        shell: bash
        run: |
          SDK=$(dotnet --list-sdks | awk '/^8\./{v=$1} END{print v}')
          echo "SDK 8: $SDK"
          dotnet new globaljson --sdk-version "$SDK" --roll-forward latestPatch --force
          dotnet --version
          dotnet workload install android

      - name: Versione e chiave
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          IFS=. read -r A B C <<< "$V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VCODE=$((A * 10000 + B * 100 + C))" >> "$GITHUB_ENV"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            # senza segreti si compila lo stesso (per vedere gli errori), ma l'APK non viene pubblicato
            echo "::warning::Mancano i segreti ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASS: compilo senza firma e non pubblico"
            echo "SIGN=-p:AndroidKeyStore=false" >> "$GITHUB_ENV"
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/firma.keystore"
            echo "SIGN=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/firma.keystore -p:AndroidSigningKeyAlias=ipdesk -p:AndroidSigningKeyPass=env:KS_PASS -p:AndroidSigningStorePass=env:KS_PASS" >> "$GITHUB_ENV"
          fi

      - name: Compila APK
        shell: bash
        run: |
          dotnet publish src/IpDeskCtrl.Android/IpDeskCtrl.Android.csproj -c Release -f net8.0-android \
            -p:Version=$VERSION -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=$VCODE \
            $SIGN -o dist/android
          mkdir -p out
          APK=$(ls dist/android/*-Signed.apk | head -1)
          cp "$APK" "out/IP-DESK-CTRL-$VERSION-android.apk"
          ls -l out
          if [ "$UNSIGNED" = "1" ]; then echo "::error::APK compilato ma non firmato con la chiave del progetto: aggiungi i segreti e rilancia"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-android
          path: out/*

  # Pubblica (o aggiorna) la release della versione scritta nel file VERSION a ogni push su main.
  # ---------------------------------------------------------------- Alpine Linux e altre distribuzioni con musl
  alpine:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Compila ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/IpDeskCtrl.Desktop/IpDeskCtrl.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o dist/${{ matrix.rid }}
      - name: Pacchetto portatile
        shell: bash
        run: |
          mkdir -p out pkg/IP-DESK-CTRL
          cp dist/${{ matrix.rid }}/IP-DESK-CTRL pkg/IP-DESK-CTRL/
          chmod +x pkg/IP-DESK-CTRL/IP-DESK-CTRL
          cp THIRD-PARTY-NOTICES.txt LICENSE src/IpDeskCtrl/Assets/icon.png pkg/IP-DESK-CTRL/
          tar -czf "out/IP-DESK-CTRL-$VERSION-${{ matrix.rid }}-portatile.tar.gz" -C pkg IP-DESK-CTRL
      - name: Prova in un contenitore Alpine (le librerie si caricano)
        shell: bash
        run: |
          docker run --rm -v "$PWD/pkg/IP-DESK-CTRL:/p" alpine:latest sh -c "apk add -q libstdc++ libgcc fontconfig libx11 >/dev/null; cd /p && timeout 20 ./IP-DESK-CTRL --version 2>&1 | head -5; ldd ./IP-DESK-CTRL | head -10" || true
      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-${{ matrix.rid }}
          path: out/*

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, android, alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: IP-DESK-CTRL ${{ env.VERSION }}
          overwrite_files: true
          files: artifacts/*
          body: |
            | Sistema | File |
            |---|---|
            | Windows 64 bit | `IP-DESK-CTRL-…-win-x64-setup.exe` (portatile: `…-win-x64-portatile.zip`) |
            | Windows 32 bit | `…-win-x86-setup.exe` (portatile: `…-win-x86-portatile.zip`) |
            | Windows ARM64 (PC con Snapdragon) | `…-win-arm64-setup.exe` (portatile: `…-win-arm64-portatile.zip`) |
            | Debian / Ubuntu / Mint | `ip-desk-ctrl_…_amd64.deb` · `…_arm64.deb` · `…_armhf.deb` |
            | Fedora / openSUSE | `ip-desk-ctrl-…-1.x86_64.rpm` · `…-1.aarch64.rpm` · `…-1.armv7hl.rpm` |
            | Raspberry Pi OS 64 bit (arm64) | `ip-desk-ctrl_…_arm64.deb` |
            | Raspberry Pi OS 32 bit (armhf) | `ip-desk-ctrl_…_armhf.deb` |
            | Slackware ARM64 (anche Raspberry Pi) · Slackware64 | `ip-desk-ctrl-…-aarch64-1_ic8tem.txz` · `…-x86_64-1_ic8tem.txz` |
            | Linux x86_64 (qualsiasi distribuzione) | `IP-DESK-CTRL-…-linux-x64-portatile.tar.gz` |
            | Linux aarch64 (PC e mini-PC non Raspberry) | `IP-DESK-CTRL-…-linux-arm64-portatile.tar.gz` |
            | Linux armv7l | `IP-DESK-CTRL-…-linux-arm-portatile.tar.gz` |
            | Arch / Manjaro / EndeavourOS / Arch Linux ARM | `ip-desk-ctrl-…-1-x86_64.pkg.tar.zst` · `…-aarch64.pkg.tar.zst` |
            | Qualsiasi Linux, un solo file (AppImage) | `IP-DESK-CTRL-…-x86_64.AppImage` · `…-aarch64.AppImage` |
            | Snap | `ip-desk-ctrl_…_amd64.snap` · `…_arm64.snap` |
            | Alpine Linux (musl) | `IP-DESK-CTRL-…-linux-musl-x64-portatile.tar.gz` · `…-linux-musl-arm64-portatile.tar.gz` |
            | Chromebook | l'APK Android, oppure il `.deb` nel Linux del Chromebook |
            | macOS Apple Silicon (M1-M4) | `IP-DESK-CTRL-…-osx-arm64.dmg` |
            | macOS Intel | `IP-DESK-CTRL-…-osx-x64.dmg` |
            | Android 8.0 e successivi | `IP-DESK-CTRL-…-android.apk` |

            macOS: al primo avvio clic destro › Apri. Android: consenti l'installazione da origini sconosciute; per farti comandare dal PC attiva il servizio in Impostazioni › Accessibilità › IP-DESK-CTRL.

            Linux e Raspberry: `sudo apt install ./ip-desk-ctrl_…deb` · Fedora `sudo dnf install ./ip-desk-ctrl-…rpm` · openSUSE `sudo zypper install --allow-unsigned-rpm ./ip-desk-ctrl-…rpm` · Slackware `installpkg ip-desk-ctrl-…txz` · Arch `sudo pacman -U ./ip-desk-ctrl-…pkg.tar.zst` · AppImage: rendilo eseguibile e avvialo · Snap `sudo snap install --dangerous --classic ./ip-desk-ctrl_…snap` · Alpine: `apk add libstdc++ fontconfig libx11`, poi scompatta e avvia (con la sessione Wayland riavvia dopo l'installazione: serve la regola per mouse e tastiera).
            macOS con Homebrew: `brew tap ic8tem/ip-desk-ctrl https://github.com/ic8tem/IP-DESK-CTRL` e poi `brew install --cask ip-desk-ctrl`.
            macOS: concedi «Registrazione schermo» e «Accessibilità» in Impostazioni di Sistema › Privacy e sicurezza; per l'audio installa BlackHole 2ch.
            Le versioni *portatile* non richiedono installazione.
            Video compresso H.264/H.265/AV1: serve ffmpeg su tutti e due i PC (Windows: Impostazioni › Scarica ffmpeg; Linux: sudo apt install ffmpeg o sudo dnf install ffmpeg-free; Mac: brew install ffmpeg).
            La X della finestra nasconde soltanto: IP-DESK-CTRL resta attivo con l'icona vicino all'orologio; per uscire clic destro sull'icona › «Esci da IP-DESK-CTRL».

            **Compatibilità**: la 0.5 si collega con la 0.4 (protocollo 3); microfono, volume, risoluzione adatta e cartella condivisa servono la 0.5 da entrambe le parti.

            Guida: https://github.com/ic8tem/IP-DESK-CTRL/wiki · Novità di ogni versione: https://github.com/ic8tem/IP-DESK-CTRL/wiki/Storia-delle-versioni

            IP-DESK-CTRL è gratuito e senza pubblicità: se ti è utile puoi sostenerlo su [Ko-fi](https://ko-fi.com/ic8tem) ♥

      # Homebrew: aggiorna Casks/ip-desk-ctrl.rb con la versione nuova e le impronte dei .dmg
      - name: Homebrew
        shell: bash
        run: |
          A=$(sha256sum artifacts/IP-DESK-CTRL-$VERSION-osx-arm64.dmg | cut -d' ' -f1)
          I=$(sha256sum artifacts/IP-DESK-CTRL-$VERSION-osx-x64.dmg | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 arm: .*/  sha256 arm:   \"$A\",/; s/^         intel: .*/         intel: \"$I\"/" Casks/ip-desk-ctrl.rb
          cat Casks/ip-desk-ctrl.rb
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add Casks/ip-desk-ctrl.rb
            git commit -m "Homebrew: IP-DESK-CTRL $VERSION [skip ci]"
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main || echo "::warning::Casks non aggiornato"
          fi

  # Pubblica le pagine di docs/wiki nella wiki di GitHub a ogni push su main.
  wiki:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna la wiki
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki già aggiornata"; exit 0; fi
          git commit -m "Wiki da docs/wiki (${GITHUB_SHA::7})"
          git push
