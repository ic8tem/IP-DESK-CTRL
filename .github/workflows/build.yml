name: Compilazione

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, arch: x64 }
          - { os: windows-latest, rid: win-x86, arch: x86 }
          - { os: windows-latest, rid: win-arm64, arch: arm64 }
          - { os: ubuntu-24.04,   rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: ubuntu-latest,  rid: linux-arm }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: macos-latest,   rid: osx-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Compila ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/IpDeskCtrl.Desktop/IpDeskCtrl.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o dist/${{ matrix.rid }}

      # ---------------------------------------------------------------- Windows: Setup.exe + zip portatile
      - name: Installatore Windows
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          $src = (Resolve-Path dist/${{ matrix.rid }}).Path
          $out = (Resolve-Path out).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" "/DOutDir=$out" packaging/windows/IP-DESK-CTRL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item THIRD-PARTY-NOTICES.txt dist/${{ matrix.rid }}/
          Copy-Item LICENSE dist/${{ matrix.rid }}/LICENSE.txt
          Compress-Archive -Path dist/${{ matrix.rid }}/IP-DESK-CTRL.exe, dist/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt, dist/${{ matrix.rid }}/LICENSE.txt -DestinationPath "out/IP-DESK-CTRL-$env:VERSION-${{ matrix.rid }}-portatile.zip"

      # ---------------------------------------------------------------- Linux e Raspberry: .deb, .rpm, Slackware .txz, tar.gz portatile
      - name: Pacchetti Linux
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/make-deb.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          sudo apt-get install -y -qq rpm >/dev/null
          packaging/linux/make-rpm.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          if [ "${{ matrix.rid }}" != "linux-arm" ]; then packaging/linux/make-slackpkg.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out; fi
          mkdir -p pkg/IP-DESK-CTRL
          cp dist/${{ matrix.rid }}/IP-DESK-CTRL pkg/IP-DESK-CTRL/
          chmod +x pkg/IP-DESK-CTRL/IP-DESK-CTRL
          cp THIRD-PARTY-NOTICES.txt LICENSE src/IpDeskCtrl/Assets/icon.png pkg/IP-DESK-CTRL/
          tar -czf "out/IP-DESK-CTRL-$VERSION-${{ matrix.rid }}-portatile.tar.gz" -C pkg IP-DESK-CTRL
          dpkg-deb --info out/*.deb | head -20

      # ---------------------------------------------------------------- AppImage, Arch Linux (.pkg.tar.zst), Snap
      - name: AppImage e Arch Linux
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get install -y -qq libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libfuse2 >/dev/null 2>&1 || true
          packaging/linux/make-appimage.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          packaging/linux/make-arch.sh ${{ matrix.rid }} "$VERSION" "$(ls out/*.deb | head -n 1)" out

      - name: Snap
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        continue-on-error: true
        shell: bash
        run: |
          sudo snap install snapcraft --classic
          packaging/linux/make-snap.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      - name: Flatpak
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get install -y -qq flatpak flatpak-builder >/dev/null
          packaging/linux/make-flatpak.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      # ---------------------------------------------------------------- macOS: .dmg + .app zip
      - name: Pacchetti macOS
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          chmod +x packaging/macos/make-dmg.sh
          packaging/macos/make-dmg.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-${{ matrix.rid }}
          path: out/*

  # ---------------------------------------------------------------- Android: APK firmato
  android:
    name: android
    runs-on: ubuntu-latest
    env:
      # chiave di firma fissa, nei segreti del repository (Settings › Secrets and variables › Actions):
      # con la stessa chiave gli aggiornamenti si installano sopra la versione precedente.
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # sul runner c'è anche un SDK più nuovo: per l'app Android (net8.0-android) si usa l'SDK 8
      - name: SDK 8 e carico di lavoro Android
        shell: bash
        run: |
          SDK=$(dotnet --list-sdks | awk '/^8\./{v=$1} END{print v}')
          echo "SDK 8: $SDK"
          dotnet new globaljson --sdk-version "$SDK" --roll-forward latestPatch --force
          dotnet --version
          dotnet workload install android

      - name: Versione e chiave
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          IFS=. read -r A B C <<< "$V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VCODE=$((A * 10000 + B * 100 + C))" >> "$GITHUB_ENV"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            # senza segreti si compila lo stesso (per vedere gli errori), ma l'APK non viene pubblicato
            echo "::warning::Mancano i segreti ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASS: compilo senza firma e non pubblico"
            echo "SIGN=-p:AndroidKeyStore=false" >> "$GITHUB_ENV"
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/firma.keystore"
            echo "SIGN=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/firma.keystore -p:AndroidSigningKeyAlias=ipdesk -p:AndroidSigningKeyPass=env:KS_PASS -p:AndroidSigningStorePass=env:KS_PASS" >> "$GITHUB_ENV"
          fi

      - name: Compila APK
        shell: bash
        run: |
          dotnet publish src/IpDeskCtrl.Android/IpDeskCtrl.Android.csproj -c Release -f net8.0-android \
            -p:Version=$VERSION -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=$VCODE \
            $SIGN -o dist/android
          mkdir -p out
          APK=$(ls dist/android/*-Signed.apk | head -1)
          cp "$APK" "out/IP-DESK-CTRL-$VERSION-android.apk"
          ls -l out
          if [ "$UNSIGNED" = "1" ]; then echo "::error::APK compilato ma non firmato con la chiave del progetto: aggiungi i segreti e rilancia"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-android
          path: out/*

  # Pubblica (o aggiorna) la release della versione scritta nel file VERSION a ogni push su main.
  # ---------------------------------------------------------------- Alpine Linux e altre distribuzioni con musl
  alpine:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Compila ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/IpDeskCtrl.Desktop/IpDeskCtrl.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o dist/${{ matrix.rid }}
      - name: Pacchetto portatile
        shell: bash
        run: |
          mkdir -p out pkg/IP-DESK-CTRL
          cp dist/${{ matrix.rid }}/IP-DESK-CTRL pkg/IP-DESK-CTRL/
          chmod +x pkg/IP-DESK-CTRL/IP-DESK-CTRL
          cp THIRD-PARTY-NOTICES.txt LICENSE src/IpDeskCtrl/Assets/icon.png pkg/IP-DESK-CTRL/
          tar -czf "out/IP-DESK-CTRL-$VERSION-${{ matrix.rid }}-portatile.tar.gz" -C pkg IP-DESK-CTRL
      - name: Prova in un contenitore Alpine (le librerie si caricano)
        shell: bash
        run: |
          docker run --rm -v "$PWD/pkg/IP-DESK-CTRL:/p" alpine:latest sh -c "apk add -q libstdc++ libgcc fontconfig libx11 >/dev/null; cd /p && timeout 20 ./IP-DESK-CTRL --version 2>&1 | head -5; ldd ./IP-DESK-CTRL | head -10" || true
      - uses: actions/upload-artifact@v4
        with:
          name: IP-DESK-CTRL-${{ matrix.rid }}
          path: out/*

  # ---------------------------------------------------------------- Flathub: prova di compilazione dai sorgenti, controllo e schermata
  flathub:
    name: flathub
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb xdotool imagemagick >/dev/null
      - name: Manifest e pacchetti NuGet
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          packaging/flathub/make-flathub.sh "$V" locale "$RUNNER_TEMP/fh"
      - name: Compilazione come su Flathub
        run: |
          cd "$RUNNER_TEMP/fh"
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean --mirror-screenshots-url=https://dl.flathub.org/media --repo=repo build io.github.ic8tem.IP-DESK-CTRL.yml
      - name: Controllo di Flathub (flatpak-builder-lint)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/fh"
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder >/dev/null
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.ic8tem.IP-DESK-CTRL.yml 2>&1 | tee lint-manifest.txt || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo 2>&1 | tee lint-repo.txt || true
      - name: Schermata della finestra principale (inglese)
        if: always()
        continue-on-error: true
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          dotnet publish src/IpDeskCtrl.Desktop/IpDeskCtrl.Desktop.csproj -c Release -r linux-x64 -p:Version=$V -o shot >/dev/null
          export LANG=en_US.UTF-8 LANGUAGE=en
          # come su Flathub: niente riquadro di aggiornamento nella schermata
          export FLATPAK_ID=io.github.ic8tem.IP-DESK-CTRL IPDESKCTRL_FLATHUB=1
          Xvfb :99 -screen 0 1400x1000x24 & sleep 2
          export DISPLAY=:99
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" ./shot/IP-DESK-CTRL & sleep 30
          WID="$(xdotool search --name 'IP-DESK-CTRL' | head -n 1)"
          import -window "${WID:-root}" "$RUNNER_TEMP/fh/main-window.png"
          import -window root "$RUNNER_TEMP/fh/schermo-intero.png"
      - name: Schermata nel ramo lavoro
        if: always() && github.ref == 'refs/heads/lavoro'
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/fh/main-window.png" ] || exit 0
          mkdir -p docs/screenshots
          cp "$RUNNER_TEMP/fh/main-window.png" docs/screenshots/main-window.png
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots && git commit -qm "Schermata per Flathub [skip ci]" && git pull -q --rebase origin lavoro && git push -q origin HEAD:lavoro || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flathub
          path: |
            ${{ runner.temp }}/fh/*.yml
            ${{ runner.temp }}/fh/*.json
            ${{ runner.temp }}/fh/*.txt
            ${{ runner.temp }}/fh/*.png

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, android, alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Testo della release (tabella dei file con i collegamenti)
        shell: bash
        run: |
          { python3 packaging/release/tabella.py "$VERSION"; echo; cat packaging/release/note.md; } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: IP-DESK-CTRL ${{ env.VERSION }}
          overwrite_files: true
          files: artifacts/*
          body_path: release-body.md

      # Homebrew, Scoop e winget: i file nel repository prendono la versione nuova e le impronte
      - name: Homebrew, Scoop, winget
        shell: bash
        run: |
          A=$(sha256sum artifacts/IP-DESK-CTRL-$VERSION-osx-arm64.dmg | cut -d' ' -f1)
          I=$(sha256sum artifacts/IP-DESK-CTRL-$VERSION-osx-x64.dmg | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 arm: .*/  sha256 arm:   \"$A\",/; s/^         intel: .*/         intel: \"$I\"/" Casks/ip-desk-ctrl.rb
          python3 - <<'PY'
          import json, hashlib, os
          v = os.environ["VERSION"]; f = "bucket/ip-desk-ctrl.json"; m = json.load(open(f))
          m["version"] = v
          for arch, rid in (("64bit", "x64"), ("32bit", "x86"), ("arm64", "arm64")):
              n = f"IP-DESK-CTRL-{v}-win-{rid}-portatile.zip"
              m["architecture"][arch]["url"] = f"https://github.com/ic8tem/IP-DESK-CTRL/releases/download/v{v}/{n}"
              m["architecture"][arch]["hash"] = hashlib.sha256(open("artifacts/" + n, "rb").read()).hexdigest()
          json.dump(m, open(f, "w"), indent=4, ensure_ascii=False); open(f, "a").write("\n")
          PY
          rm -rf packaging/winget/ic8tem.IP-DESK-CTRL
          packaging/winget/make-winget.sh "$VERSION" artifacts packaging/winget/ic8tem.IP-DESK-CTRL
          if [ -n "$(git status --porcelain Casks bucket packaging/winget)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add Casks bucket packaging/winget
            git commit -m "Homebrew, Scoop, winget: IP-DESK-CTRL $VERSION [skip ci]"
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main || echo "::warning::manifesti non aggiornati"
          fi

  # Chocolatey: pacchetto .nupkg allegato alla release; si pubblica su chocolatey.org solo se c'è il segreto CHOCOLATEY_API_KEY
  chocolatey:
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Pacchetto Chocolatey
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force setup | Out-Null
          gh release download "v$v" -p "*-setup.exe" -D setup
          $h = @{}; foreach ($r in 'x86','x64','arm64') { $h[$r] = (Get-FileHash "setup/IP-DESK-CTRL-$v-win-$r-setup.exe" -Algorithm SHA256).Hash.ToLower() }
          $n = 'packaging/chocolatey/ip-desk-ctrl.nuspec'; (Get-Content $n -Raw).Replace('VERSIONE', $v) | Set-Content $n
          $p = 'packaging/chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $p -Raw).Replace('VERSIONE', $v).Replace('SHA_X86', $h['x86']).Replace('SHA_X64', $h['x64']).Replace('SHA_ARM64', $h['arm64']) | Set-Content $p
          choco pack $n --outputdirectory .
          gh release upload "v$v" "ip-desk-ctrl.$v.nupkg" --clobber
          if ($env:CHOCO_KEY) { choco push "ip-desk-ctrl.$v.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_KEY }
          else { Write-Host "CHOCOLATEY_API_KEY non impostato: il pacchetto resta solo nella release" }

  # Pubblica le pagine di docs/wiki nella wiki di GitHub a ogni push su main.
  wiki:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna la wiki
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki già aggiornata"; exit 0; fi
          git commit -m "Wiki da docs/wiki (${GITHUB_SHA::7})"
          git push
