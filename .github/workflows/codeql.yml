# Analisi del codice con CodeQL (GitHub): cerca falle di sicurezza nel C# a ogni modifica di main e
# lavoro, a ogni richiesta di modifica e una volta alla settimana. Senza compilare (build-mode: none).
name: CodeQL

on:
  push:
    branches: [ main, lavoro ]
    paths: [ 'src/**', '.github/workflows/codeql.yml' ]
  pull_request:
    paths: [ 'src/**' ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
